aid: subvysion
name: SubVysion
description: SubVysion is a subsurface mapping intelligence company that delivers 3D maps of hidden
  underground infrastructure for construction crews, utility locators, and contractors. It combines
  multi-sensor ground-penetrating radar (GPR) with 3D mapping to visualize buried utilities, pipes,
  and conduits so teams can see what is below before they dig or break ground — reducing strikes,
  rework, and safety incidents. Backed by Y Combinator, SubVysion is an early-stage company that
  currently publishes a marketing website only; as of this enrichment pass it exposes no public API,
  developer portal, SDKs, or documentation surface.
